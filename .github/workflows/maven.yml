# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven & MySQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Khởi tạo mySQL để chạy
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Initialize Database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot < src/main/resources/db/mysql-schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot < src/main/resources/db/insert-admin-account.sql

      - name: Setup config.properties
        run: |
          echo "auction.db.url=jdbc:mysql://127.0.0.1:3306/auction_app" > src/main/resources/config.properties
          echo "auction.db.user=root" >> src/main/resources/config.properties
          echo "auction.db.password=root" >> src/main/resources/config.properties
          echo "auction.server.port=8080" >> src/main/resources/config.properties

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Blue88-App-Artifact
          path: target/*.jar